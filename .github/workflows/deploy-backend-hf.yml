name: Deploy backend to HF Space

# Disparadores:
#  - push a main cuando cambian archivos del backend
#  - ejecucion manual desde la UI de GitHub Actions
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-hf.yml'
  workflow_dispatch:

# No usamos OIDC/Trusted Publisher porque la action oficial
# `huggingface/actions/login@v1` no existe en GitHub (verificado
# via api.github.com). Usamos un fine-grained token de HF guardado
# como GitHub Secret.
#
# Para configurarlo:
#   1. Crear token en https://huggingface.co/settings/tokens/new
#      - Token type: Fine-grained
#      - Repository permissions: calvin261/lsec-api (Write)
#   2. Guardarlo en
#      https://github.com/calvin261/ModeloPrototipo/settings/secrets/actions/new
#      - Name:  HF_TOKEN
#      - Value: hf_xxxxxxxxxxxxxx
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install huggingface_hub
        run: pip install --upgrade "huggingface_hub>=0.24.0"

      - name: Sync backend -> HF Space
        env:
          HF_REPO_ID: calvin261/lsec-api
          GITHUB_SHA: ${{ github.sha }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os, shutil, sys
          from pathlib import Path
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN")
          if not token:
              sys.exit("ERROR: HF_TOKEN secret no definido. Crear uno en https://huggingface.co/settings/tokens/new y guardarlo en GitHub Secrets.")

          api = HfApi(token=token)
          repo_id = os.environ['HF_REPO_ID']
          sha = os.environ['GITHUB_SHA']

          # Mapeo backend/ (GitHub) -> raiz del Space (HF)
          # NO sincronizamos backend/api/Dockerfile porque el HF Space
          # tiene su propio Dockerfile optimizado.
          mappings = [
              ("backend/api",          "api"),
              ("backend/hand_model",   "hand_model"),
              ("backend/scripts",      "scripts"),
              ("backend/datasets",     "datasets"),
              ("backend/requirements-docker.txt", "api/requirements-docker.txt"),
              ("backend/pyproject.toml", "pyproject.toml"),
          ]

          staging = Path("hf_staging")
          if staging.exists():
              shutil.rmtree(staging)
          staging.mkdir(parents=True)

          for src, dst in mappings:
              src_path = Path(src)
              if not src_path.exists():
                  print(f"  SKIP {src} (no existe)")
                  continue
              dst_path = staging / dst
              dst_path.parent.mkdir(parents=True, exist_ok=True)
              if src_path.is_dir():
                  shutil.copytree(src_path, dst_path)
              else:
                  shutil.copy2(src_path, dst_path)
              print(f"  + {src} -> {dst}")

          result = api.upload_folder(
              folder_path=str(staging),
              repo_id=repo_id,
              repo_type="space",
              commit_message=f"Deploy from GitHub Actions (commit {sha[:7]})",
              ignore_patterns=[
                  "*.pyc", "__pycache__/**", "data/**",
                  "models/**", "*.npy", "*.log",
              ],
          )
          print(f"\nOK: {result}")
          print(f"Space: https://huggingface.co/spaces/{repo_id}")
          PY

      - name: Verify deploy
        env:
          LSEC_API_KEY: ${{ secrets.LSEC_API_KEY }}
        run: |
          echo "Esperando 90s para que HF Space rebuilde..."
          sleep 90
          if [ -n "$LSEC_API_KEY" ]; then
            auth=(-H "X-API-Key: $LSEC_API_KEY")
          else
            auth=()
          fi
          for i in 1 2 3 4 5; do
            response=$(curl -fsS -m 15 "${auth[@]}" \
              "https://calvin261-lsec-api.hf.space/api/v1/version" 2>&1 || echo "FAIL")
            if echo "$response" | grep -q '"api_version"'; then
              echo "$response"
              exit 0
            fi
            echo "Intento $i: $response"
            sleep 30
          done
          echo "WARN: el endpoint no respondio en 5 intentos. Verificar manualmente."
          exit 1