name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true

env:
  # Backend HF Space — el APK release apunta aquí por defecto.
  LSEC_DEFAULT_BACKEND_URL: https://calvin261-lsec-api.hf.space/

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # required to create the GitHub Release

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ── Capa 1: cache de Gradle (deps + build cache) ────────────────────
      # Clave primaria incluye hash de libs.versions.toml y todos los build
      # scripts para invalidar cuando cambien versiones de dependencias.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/notifications
            frontend/.gradle
            frontend/app/build
            frontend/build
          key: ${{ runner.os }}-gradle-${{ hashFiles('frontend/gradle/libs.versions.toml', 'frontend/**/*.gradle*', 'frontend/gradle.properties', 'frontend/app/build.gradle.kts', 'frontend/app/proguard-rules.pro') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── Capa 2: cache de AVD / SDK de Android (NDK, build-tools) ────────
      # El primer build descarga ~1 GB de NDK + build-tools; este cache lo evita.
      - name: Cache Android SDK + NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/Android/Sdk/build-tools
            ~/Android/Sdk/platforms
            ~/Android/Sdk/ndk
            ~/Android/Sdk/cmdline-tools
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('frontend/app/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      # ── Pre-cache de Gradle: hidrata la cache de dependencias ───────────
      # Sin esto, la primera build dentro del job tarda minutos en resolver
      # el classpath. Con esto, la primera build post-restore corre contra la
      # cache caliente. Solo KSP de release (no debug) para no contaminar
      # app/build/ con salidas de debug en un job de release.
      - name: Warm Gradle cache (dependencies pre-fetch)
        working-directory: frontend
        run: |
          chmod +x ./gradlew
          ./gradlew \
            --no-daemon \
            -q \
            dependencies \
            :app:dependencies \
            :app:kspReleaseKotlin

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.keystore

      - name: Resolve release tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG" ] || [ "$TAG" = "$GITHUB_REF" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Compute version code
        id: vc
        run: |
          # v1.2.3 -> 10203 (strip leading v, split by ., pack)
          TAG="${{ steps.tag.outputs.tag }}"
          VER="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VER"
          echo "code=$((MAJOR*10000 + MINOR*100 + PATCH))" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: frontend
        env:
          LSEC_STORE_FILE: ../keystore/release.keystore
          LSEC_STORE_PASS: ${{ secrets.STORE_PASS }}
          LSEC_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LSEC_KEY_PASS: ${{ secrets.KEY_PASS }}
          # Nueva: clave embebida en BuildConfig.BUNDLED_API_KEY para que el
          # interceptor OkHttp la inyecte en X-API-Key sin intervención del usuario.
          LSEC_API_KEY: ${{ secrets.LSEC_API_KEY }}
        run: |
          chmod +x ./gradlew
          ./gradlew \
            -PversionName="${{ steps.tag.outputs.tag }}" \
            -PversionCode=${{ steps.vc.outputs.code }} \
            --build-cache \
            --parallel \
            -x lintVitalRelease \
            -x lintVitalAnalyzeRelease \
            -x lintVitalReportRelease \
            -x lint \
            assembleRelease

      - name: Locate APK
        id: apk
        working-directory: frontend
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name "app-release.apk" | head -n1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$APK")" >> "$GITHUB_OUTPUT"

      - name: Upload APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "LSEC Translator ${{ steps.tag.outputs.tag }}"
          generate_release_notes: true
          files: |
            frontend/app/build/outputs/apk/release/app-release.apk
            frontend/app/build/outputs/apk/release/output-metadata.json

      - name: Upload APK artifact (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.tag.outputs.tag }}
          path: frontend/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
