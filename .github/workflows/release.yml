name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.keystore

      - name: Resolve release tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG" ] || [ "$TAG" = "$GITHUB_REF" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Compute version code
        id: vc
        run: |
          # v1.2.3 -> 10203 (strip leading v, split by ., pack)
          TAG="${{ steps.tag.outputs.tag }}"
          VER="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VER"
          echo "code=$((MAJOR*10000 + MINOR*100 + PATCH))" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: frontend
        env:
          LSEC_STORE_FILE: ../keystore/release.keystore
          LSEC_STORE_PASS: ${{ secrets.STORE_PASS }}
          LSEC_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LSEC_KEY_PASS: ${{ secrets.KEY_PASS }}
          LSEC_DEFAULT_BACKEND_URL: https://calvin261-lsec-api.hf.space/
        run: |
          chmod +x ./gradlew
          ./gradlew \
            -PversionName="${{ steps.tag.outputs.tag }}" \
            -PversionCode=${{ steps.vc.outputs.code }} \
            assembleRelease

      - name: Locate APK
        id: apk
        working-directory: frontend
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name "app-release.apk" | head -n1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$APK")" >> "$GITHUB_OUTPUT"

      - name: Upload APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "LSEC Translator ${{ steps.tag.outputs.tag }}"
          generate_release_notes: true
          files: |
            frontend/app/build/outputs/apk/release/app-release.apk
            frontend/app/build/outputs/apk/release/output-metadata.json

      - name: Upload APK artifact (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.tag.outputs.tag }}
          path: frontend/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
