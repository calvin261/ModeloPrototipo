services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: lsec-backend:latest
    container_name: lsec-backend
    ports:
      - "8000:8000"
    volumes:
      # Persist user data and trained models outside the container
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped
    env_file:
      - path: .env
        required: false   # no falla si no existe (dev local sin clave)
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
